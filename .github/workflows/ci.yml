name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no secret token

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure esbuild binary
        run: node node_modules/esbuild/install.js

      - name: Audit dependencies
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage gate
        run: npm run coverage:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

      - name: Build static dist
        run: npm run build

      - name: Verify dist assets
        run: npm run check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
