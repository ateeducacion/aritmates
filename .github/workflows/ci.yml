name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure esbuild binary
        run: node node_modules/esbuild/install.js

      - name: Build static dist
        run: npm run build

      - name: Verify dist assets
        run: npm run check

      - name: Run CI test suite (stable)
        run: npm run test:ci

      - name: Run full unit suite (legacy, non-blocking)
        continue-on-error: true
        run: npm run test:all

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
