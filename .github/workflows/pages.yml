# Compila dist/ y publica en GitHub Pages (project site).
# Requiere en el repo: Settings → Pages → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure esbuild binary
        run: node node_modules/esbuild/install.js

      - name: Public baseurl for share links (project Pages URL)
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          BASEURL="https://${OWNER}.github.io/${REPO}/"
          node -e "
            const fs = require('fs');
            const p = 'src/config.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.baseurl = process.env.BASEURL;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            console.log('baseurl →', c.baseurl);
          "
        env:
          BASEURL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Build static dist
        run: npm run build

      - name: Verify dist assets
        run: npm run check

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
