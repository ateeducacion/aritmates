# Compila dist/ y publica en GitHub Pages (project site).
# Requiere en el repo: Settings → Pages → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Public baseurl for share links (project Pages URL)
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          BASEURL="https://${OWNER}.github.io/${REPO}/"
          node -e "
            const fs = require('fs');
            const p = 'src/config.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.baseurl = process.env.BASEURL;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
            console.log('baseurl →', c.baseurl);
          "
        env:
          BASEURL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Build static dist
        run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Verify dist assets
        run: npm run check

      - name: Add Sentry error monitoring
        env:
          SENTRY_DSN: https://be343f7d81d717f3d93524a4a61c84cd@o4510456164712448.ingest.de.sentry.io/4512272277635152
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: erseco
          SENTRY_PROJECT: aritmates
          SENTRY_URL: https://de.sentry.io/
          DIST: dist
        run: |
          REL="${GITHUB_SHA::12}"
          work="$RUNNER_TEMP/sentry"; mkdir -p "$work"
          printf '%s\n' \
            "import * as Sentry from '@sentry/browser';" \
            "Sentry.init({ dsn: '$SENTRY_DSN', release: '$REL', environment: 'production', sendDefaultPii: false, integrations: (d) => d.filter((i) => i.name !== 'BrowserSession') });" \
            > "$work/entry.js"
          (cd "$work" && npm i --no-save --no-audit --no-fund --silent @sentry/browser@11.4.0 esbuild@0.28.2 \
            && npx esbuild entry.js --bundle --minify --format=iife --outfile="$GITHUB_WORKSPACE/$DIST/sentry.js")
          # load before the app's own scripts, from every built page (<head>, not <header>)
          find "$DIST" -name '*.html' -print0 | while IFS= read -r -d '' f; do
            rel=$(realpath --relative-to="$(dirname "$f")" "$DIST/sentry.js")
            sed -E -i "0,/<head(\s[^>]*)?>/s##&<script src=\"$rel\"></script>#" "$f"
          done
          if [ -n "$SENTRY_AUTH_TOKEN" ] && find "$DIST" -name '*.map' | grep -q .; then
            npx --yes @sentry/cli@3.8.0 sourcemaps inject "$DIST"
            npx --yes @sentry/cli@3.8.0 sourcemaps upload --release "$REL" "$DIST"
          fi
          find "$DIST" -name '*.map' -delete   # never publish sourcemaps

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
