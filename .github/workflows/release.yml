name: Release and Deploy

on:
  release:
    types: [published]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure esbuild binary
        run: node node_modules/esbuild/install.js

      - name: Build static dist
        run: npm run build

      - name: Run CI tests
        run: npm run test:ci

      - name: Generate release ZIP with Makefile
        run: |
          TAG_NAME=${GITHUB_REF##*/}  # Extract tag name from ref
          make package

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
